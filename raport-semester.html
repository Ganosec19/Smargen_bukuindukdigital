<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lembar Raport & Capaian Semester (Multi-Kurikulum & Spinner Excel)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f1f5f9; font-family: 'Times New Roman', Times, serif, Arial, sans-serif; color: #000; }
    
    /* Tombol Navigasi & Panel Kontrol (Hilang total saat diprint) */
    .no-print { background: #1e3e62; color: white; padding: 12px 0; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; position: sticky; top: 0; z-index: 1000; }
    
    /* Tombol Spinner Ala Excel (Panah Atas / Bawah) */
    .excel-spinner {
      display: inline-flex;
      flex-direction: column;
      border: 1px solid #ced4da;
      background: #f8f9fa;
      border-radius: 4px;
      overflow: hidden;
      height: 31px;
      vertical-align: middle;
    }
    .excel-spinner button {
      background: #e9ecef;
      border: none;
      width: 24px;
      height: 15.5px;
      font-size: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #333;
    }
    .excel-spinner button:hover { background: #cbd5e1; color: #000; }
    .excel-spinner button:active { background: #94a3b8; }

    /* Lembar A4 Raport */
    .sheet-a4 {
      width: 210mm;
      min-height: 297mm;
      background: white;
      margin: 0 auto 20mm auto;
      padding: 12mm 18mm;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      box-sizing: border-box;
      position: relative;
      page-break-after: always;
    }

    .raport-title { font-weight: bold; text-align: center; text-transform: uppercase; font-size: 1rem; margin-bottom: 15px; }
    .table-raport { width: 100%; font-size: 0.85rem; border-collapse: collapse; border: 1px solid #000; margin-top: 10px; margin-bottom: 15px; }
    .table-raport td, .table-raport th { border: 1px solid #000; padding: 6px 8px; vertical-align: middle; }
    .table-raport th { background: #f8fafc; text-align: center; }

    /* Input polos tanpa garis kotak */
    .input-editable { border: none; background: transparent; padding: 0; font-family: inherit; font-size: inherit; outline: none; width: 100%; text-align: center; }
    .input-editable:hover, .input-editable:focus { background: #f8fafc; border-bottom: 1px dotted #666; }

    /* Kotak isian manual bersih murni */
    .input-manual-capaian {
      border: none;
      background: transparent;
      width: 100%;
      font-family: inherit;
      font-size: inherit;
      outline: none;
      min-height: 40px;
    }
    .input-manual-capaian:focus { background: #f8fafc; }

    @media print {
      body { background: white; }
      .no-print { display: none !important; }
      .sheet-a4 { box-shadow: none; margin: 0; padding: 12mm 18mm; width: 100%; min-height: 297mm; page-break-after: always; }
      .input-editable, .input-manual-capaian { border: none !important; background: transparent !important; }
    }
  </style>
</head>
<body onkeydown="handleKeyboardNav(event)">

  <!-- KONTROL ATAS (TIDAK IKUT TERCETAK) -->
  <div class="no-print">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div>
        <a href="index.html" class="btn btn-outline-light btn-sm fw-bold"><i class="fa-solid fa-arrow-left me-1"></i> Kembali ke Menu Utama</a>
        <span class="ms-2 small text-white-50">(Gunakan Panah Spinner atau Keyboard <b>↑ ↓</b>)</span>
      </div>
      <div class="d-flex align-items-center gap-2 flex-wrap">
        
        <!-- KONTROL SPINNER ALA EXCEL (NAMA SISWA + TOMBOL PANAH) -->
        <div class="d-flex align-items-center bg-white rounded border px-2 py-1">
          <span class="small fw-bold text-dark me-2">Peserta:</span>
          <select id="selectSiswa" class="form-select form-select-sm border-0 fw-bold shadow-none p-0 me-1" style="width: 200px;" onchange="muatDataRaport()">
            <!-- Opsi siswa dimuat otomatis -->
          </select>
          <!-- SPINNER BUTTON ALA EXCEL -->
          <div class="excel-spinner">
            <button onclick="ubahSiswa(-1)" title="Siswa Sebelumnya"><i class="fa-solid fa-caret-up"></i></button>
            <button onclick="ubahSiswa(1)" title="Siswa Berikutnya"><i class="fa-solid fa-caret-down"></i></button>
          </div>
        </div>

        <select id="selectSemester" class="form-select form-select-sm fw-bold" onchange="muatDataRaport()" style="width: 140px;">
          <option value="1">Semester 1 (Ganjil)</option>
          <option value="2">Semester 2 (Genap)</option>
          <option value="3">Semester 3 (Ganjil)</option>
          <option value="4">Semester 4 (Genap)</option>
          <option value="5">Semester 5 (Ganjil)</option>
          <option value="6">Semester 6 (Genap)</option>
        </select>
        <button class="btn btn-warning btn-sm text-dark fw-bold px-3" onclick="window.print()">
          <i class="fa-solid fa-print me-1"></i> Cetak Siswa Ini
        </button>
        <button class="btn btn-success btn-sm text-white fw-bold px-3" onclick="cetakSemuaSiswa()">
          <i class="fa-solid fa-print me-1"></i> Cetak Semua (Massal)
        </button>
      </div>
    </div>
  </div>

  <div id="containerRaport">
    <!-- Konten Raport dirender dinamis -->
  </div>

  <script>
    let dbSiswa = JSON.parse(localStorage.getItem('buku_induk_arsip_db')) || [];
    let headerMapel = JSON.parse(localStorage.getItem('buku_induk_header_mapel')) || Array(15).fill('');

    window.onload = function() {
      inisialisasiDropdown();
      muatDataRaport();
    };

    function inisialisasiDropdown() {
      let select = document.getElementById('selectSiswa');
      if(dbSiswa.length === 0) {
        select.innerHTML = `<option>Belum ada data siswa</option>`;
        document.getElementById('containerRaport').innerHTML = `<div class="text-center py-5"><h4>Belum ada data siswa. Silakan buat data di Register terlebih dahulu.</h4></div>`;
        return;
      }

      select.innerHTML = '';
      dbSiswa.forEach((s, idx) => {
        let namaLabel = s.nama ? s.nama : `Siswa Kosong #${idx+1}`;
        select.innerHTML += `<option value="${s.id}">No. ${s.noUrut || (idx+1)} — ${namaLabel}</option>`;
      });
    }

    // FUNGSI TOMBOL SPINNER EXCEL (KLIK PANAH ATAS/BAWAH)
    function ubahSiswa( arah ) {
      let select = document.getElementById('selectSiswa');
      let indexBaru = select.selectedIndex + arah;
      if (indexBaru >= 0 && indexBaru < select.options.length) {
        select.selectedIndex = indexBaru;
        muatDataRaport();
      }
    }

    // NAVIGASI KEYBOARD PANAH ATAS & BAWAH
    function handleKeyboardNav(e) {
      if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT' || document.activeElement.tagName === 'TEXTAREA') {
        if(document.activeElement.id !== 'selectSiswa') return;
      }

      if (e.key === 'ArrowUp') {
        e.preventDefault();
        ubahSiswa(-1);
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        ubahSiswa(1);
      }
    }

    function muatDataRaport() {
      let siswaId = document.getElementById('selectSiswa').value;
      let semester = document.getElementById('selectSemester').value;
      let siswa = dbSiswa.find(s => String(s.id) === String(siswaId));

      if(!siswa) return;
      document.getElementById('containerRaport').innerHTML = renderSatuHalamanRaport(siswa, semester);
    }

    function renderSatuHalamanRaport(siswa, semester) {
      let kurikulum = siswa.kurikulum || 'merdeka';
      let namaSiswa = siswa.nama || '-';
      let nisSiswa = siswa.nis || '-';
      let nisnSiswa = siswa.nisn || '-';

      let listMapelHtml = '';
      let nomorUrutMapel = 1;

      for(let i = 0; i < 15; i++) {
        let namaMataPelajaran = headerMapel[i] ? headerMapel[i] : '';
        let nilaiSiswa = siswa.arrayNilai && siswa.arrayNilai[i] !== undefined ? siswa.arrayNilai[i] : '-';

        if(namaMataPelajaran.trim() !== '') {
          if(kurikulum === 'merdeka') {
            listMapelHtml += `
              <tr>
                <td class="text-center align-middle">${nomorUrutMapel++}</td>
                <td class="align-middle"><b>${namaMataPelajaran}</b></td>
                <td class="text-center fw-bold align-middle">${nilaiSiswa}</td>
                <td class="align-middle">
                  <input type="text" class="input-manual-capaian" placeholder="Ketik capaian kompetensi...">
                </td>
              </tr>
            `;
          } else {
            listMapelHtml += `
              <tr>
                <td class="text-center">${nomorUrutMapel++}</td>
                <td><b>${namaMataPelajaran}</b></td>
                <td class="text-center fw-bold">${nilaiSiswa}</td>
                <td class="text-center">${nilaiSiswa !== '-' ? (parseInt(nilaiSiswa) >= 75 ? 'B' : 'C') : '-'}</td>
                <td class="text-center fw-bold">${nilaiSiswa}</td>
                <td class="text-center">${nilaiSiswa !== '-' ? (parseInt(nilaiSiswa) >= 75 ? 'B' : 'C') : '-'}</td>
              </tr>
            `;
          }
        }
      }

      if(nomorUrutMapel === 1) {
        listMapelHtml = `<tr><td colspan="6" class="text-center text-muted py-3">Belum ada mata pelajaran yang diatur di menu Matriks Rekap Nilai.</td></tr>`;
      }

      let tabelHtml = '';
      if(kurikulum === 'merdeka') {
        tabelHtml = `
          <table class="table-raport">
            <thead>
              <tr>
                <th style="width: 6%;">No</th>
                <th style="width: 28%;">Mata Pelajaran</th>
                <th style="width: 12%;">Nilai Akhir</th>
                <th style="width: 54%;">Capaian Kompetensi / Deskripsi / KKTP</th>
              </tr>
            </thead>
            <tbody>
              ${listMapelHtml}
            </tbody>
          </table>
        `;
      } else {
        tabelHtml = `
          <table class="table-raport">
            <thead>
              <tr>
                <th rowspan="2" style="width: 6%;">No</th>
                <th rowspan="2" style="width: 34%;">Mata Pelajaran</th>
                <th colspan="2">Pengetahuan (KI-3)</th>
                <th colspan="2">Keterampilan (KI-4)</th>
              </tr>
              <tr>
                <th style="width: 15%;">Nilai</th>
                <th style="width: 10%;">Predikat</th>
                <th style="width: 15%;">Nilai</th>
                <th style="width: 10%;">Predikat</th>
              </tr>
            </thead>
            <tbody>
              ${listMapelHtml}
            </tbody>
          </table>
        `;
      }

      return `
        <div class="sheet-a4">
          <div class="raport-title">
            <b>LAPORAN HASIL BELAJAR PESERTA DIDIK (RAPORT)</b><br>
            <span>SEMESTER ${semester} — TAHUN AJARAN 2025/2026</span>
          </div>

          <table class="table table-sm table-borderless mb-2" style="font-size: 0.85rem;">
            <tr>
              <td style="width: 20%;">Nama Peserta Didik</td>
              <td style="width: 2px;">:</td>
              <td><b>${namaSiswa} (No. Urut: ${siswa.noUrut || '-'})</b></td>
              <td style="width: 15%;">Kelas</td>
              <td style="width: 2px;">:</td>
              <td>7 (Tujuh)</td>
            </tr>
            <tr>
              <td>Nomor Induk / NISN</td>
              <td>:</td>
              <td>${nisSiswa} / ${nisnSiswa}</td>
              <td>Fase / Program</td>
              <td>:</td>
              <td>Paket B Setara SMP</td>
            </tr>
            <tr>
              <td>Nama Lembaga</td>
              <td>:</td>
              <td>PKBM Ristek Nusantara Jaya</td>
              <td>NPSN</td>
              <td>:</td>
              <td>P9998715</td>
            </tr>
          </table>

          <hr class="mb-2">

          ${tabelHtml}

          <!-- BAGIAN TANDA TANGAN (POSISI PROPORSIONAL TIDAK TERLALU KE BAWAH) -->
          <div class="row mt-4 pt-2" style="font-size: 0.85rem; page-break-inside: avoid;">
            <div class="col-4 text-center">
              <p class="mb-5">Mengetahui,<br>Orang Tua / Wali Murid</p>
              <p class="mb-0"><b>( .................................... )</b></p>
            </div>
            <div class="col-4"></div>
            <div class="col-4 text-center">
              <p class="mb-1">
                <input type="text" class="input-editable fw-bold mb-1" value="Bekasi, 21 Juni 2026"><br>
                Wali Kelas / Tutor Pengampu
              </p>
              <p class="mb-5"></p>
              <p class="mb-0">
                <input type="text" class="input-editable fw-bold" value="Faisal Farid, CEH"><br>
                <span class="text-muted small">NIP. ....................................</span>
              </p>
            </div>
          </div>
        </div>
      `;
    }

    function cetakSemuaSiswa() {
      let semester = document.getElementById('selectSemester').value;
      let container = document.getElementById('containerRaport');
      let htmlGabungan = '';

      dbSiswa.forEach(siswa => {
        htmlGabungan += renderSatuHalamanRaport(siswa, semester);
      });

      container.innerHTML = htmlGabungan;
      setTimeout(() => {
        window.print();
        muatDataRaport();
      }, 500);
    }
  </script>
</body>
</html>
